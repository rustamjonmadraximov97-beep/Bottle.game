<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spin the Bottle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #2b1d0c;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .table {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #8b5a2b;
            border: 8px solid #5c3a1e;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .bottle {
            width: 50px;
            height: 150px;
            background: linear-gradient(to right, #2e7d32, #4caf50, #1b5e20);
            border-radius: 20px 20px 5px 5px;
            position: relative;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: pointer;
        }
        .bottle::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 15px;
            width: 20px;
            height: 25px;
            background: #1b5e20;
            border-radius: 3px;
        }
        .btn {
            margin-top: 30px;
            padding: 12px 24px;
            background: #ff9800;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="table">
        <div class="bottle" id="bottle"></div>
    </div>

    <button class="btn" onclick="spin()">AYLANTIRISH 🍾</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentAngle = 0;
        function spin() {
            const bottle = document.getElementById('bottle');
            const randomDegrees = Math.floor(Math.random() * 360) + 1440; // Kamida 4 marta to'liq aylanadi
            currentAngle += randomDegrees;
            bottle.style.transform = `rotate(${currentAngle}deg)`;
        }
    </script>
</body>
</html>
