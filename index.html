<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spin the Bottle - OK.ru Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background: radial-gradient(circle, #2c1654 0%, #150b29 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }
        
        /* Yuqori panel (Header) */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .room-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
        }
        .balance {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #00ff87;
            border: 1px solid rgba(0, 255, 135, 0.3);
        }

        /* O'yin Maydoni (Stol) */
        .game-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        .table {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #3d1f75 0%, #1d0f3b 80%);
            border: 6px solid #ffb703;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.3), inset 0 0 20px rgba(0,0,0,0.6);
        }

        /* O'yinchilar (Avatarlar) */
        .player {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #4cc9f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 3px solid #fff;
            transition: 0.3s;
        }
        .player img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .player-name {
            position: absolute;
            bottom: -18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 10px;
            white-space: nowrap;
        }

        /* O'yinchilarning stoldagi o'rni (6 ta o'yinchi uchun) */
        .p0 { top: 5px; left: 132px; }
        .p1 { top: 55px; right: 25px; }
        .p2 { bottom: 55px; right: 25px; }
        .p3 { bottom: 5px; left: 132px; }
        .p4 { bottom: 55px; left: 25px; }
        .p5 { top: 55px; left: 25px; }

        .player.active-target {
            transform: scale(1.15);
            border-color: #ff007f;
            box-shadow: 0 0 15px #ff007f;
        }

        /* Butilka */
        .bottle-wrapper {
            position: absolute;
            width: 40px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.15, 1);
            z-index: 10;
        }
        .bottle {
            width: 32px;
            height: 130px;
            background: linear-gradient(135deg, #ff007f, #7209b7);
            border-radius: 15px 15px 8px 8px;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            border: 2px solid rgba(255,255,255,0.4);
        }
        .bottle::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 8px;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 3px;
        }

        /* Xabarlar oynasi */
        .message-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pastki tugmalar */
        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background: linear-gradient(135deg, #f72585, #b5179e);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-gift {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
        }

        /* Modal oyna (Sovg'a yuborish uchun) */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #241442;
            padding: 20px;
            border-radius: 20px;
            width: 85%;
            text-zIndex: 101;
            border: 2px solid #ffb703;
            text-align: center;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #ffb703;
        }
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .gift-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .gift-item:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="room-title">👑 VIP Stol #1</div>
        <div class="balance">💰 <span id="userBonus">10,000</span></div>
    </div>

    <!-- O'yin Stol -->
    <div class="game-container">
        <div class="table"></div>
        
        <!-- O'yinchilar -->
        <div class="player p0" id="player-0"><div class="player-name">Siz</div>👤</div>
        <div class="player p1" id="player-1"><div class="player-name">Malika</div>👩</div>
        <div class="player p2" id="player-2"><div class="player-name">Jasur</div>👨</div>
        <div class="player p3" id="player-3"><div class="player-name">Sardor</div>👦</div>
        <div class="player p4" id="player-4"><div class="player-name">Madina</div>👧</div>
        <div class="player p5" id="player-5"><div class="player-name">Bekzod</div>🧔</div>

        <!-- Butilka -->
        <div class="bottle-wrapper" id="bottleWrapper">
            <div class="bottle"></div>
        </div>
    </div>

    <!-- Xabar paneli -->
    <div class="message-box" id="gameMessage">
        Butilkani aylantirish uchun pastdagi tugmani bosing!
    </div>

    <!-- Boshqaruv tugmalari -->
    <div class="controls">
        <button class="btn btn-gift" onclick="openGiftModal()">🎁 Sovg'a</button>
        <button class="btn" id="spinBtn" onclick="spinBottle()">🔄 Aylantirish</button>
    </div>

    <!-- Sovg'a oynasi -->
    <div class="modal" id="giftModal">
        <div class="modal-content">
            <h3>Sovg'a tanlang</h3>
            <div class="gift-grid">
                <div class="gift-item" onclick="sendGift('🌹')">🌹</div>
                <div class="gift-item" onclick="sendGift('💍')">💍</div>
                <div class="gift-item" onclick="sendGift('🎁')">🎁</div>
                <div class="gift-item" onclick="sendGift('🍸')">🍸</div>
                <div class="gift-item" onclick="sendGift('🍫')">🍫</div>
                <div class="gift-item" onclick="sendGift('💖')">💖</div>
            </div>
            <button class="btn" onclick="closeGiftModal()" style="padding: 8px; font-size: 13px;">Yopish</button>
        </div>
    </div>

    <script>
        let currentRotation = 0;
        let isSpinning = false;
        const playersCount = 6;
        const playerNames = ["Siz", "Malika", "Jasur", "Sardor", "Madina", "Bekzod"];

        function spinBottle() {
            if (isSpinning) return;
            isSpinning = true;
            
            // Oldingi aktiv targetni olib tashlash
            document.querySelectorAll('.player').forEach(p => p.classList.remove('active-target'));
            document.getElementById("gameMessage").innerText = "🔄 Butilka aylanmoqda...";

            const bottleWrapper = document.getElementById("bottleWrapper");
            
            // Tasodifiy o'yinchini tanlash (0 dan 5 gacha)
            const targetIndex = Math.floor(Math.random() * playersCount);
            
            // Har bir o'yinchi taxminan 60 gradusdan to'g'ri keladi (360 / 6 = 60)
            // Aniq o'sha o'yinga borishi uchun burchakni moslaymiz
            const baseSpins = 360 * 5; // 5 ta to'liq aylanish
            const targetAngle = targetIndex * 60; 
            currentRotation += baseSpins + targetAngle;

            bottleWrapper.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const chosenPlayer = playerNames[targetIndex];
                
                // O'yinchini belgilash
                document.getElementById(`player-${targetIndex}`).classList.add('active-target');
                
                if (targetIndex === 0) {
                    document.getElementById("gameMessage").innerText = `🎉 Tabriklaymiz, butilka Sizga to'xtadi!`;
                } else {
                    document.getElementById("gameMessage").innerText = `🎯 Butilka ${chosenPlayer}ga to'xtadi! Unga munosabat bildiring.`;
                }
            }, 3500);
        }

        function openGiftModal() {
            document.getElementById("giftModal").style.display = "flex";
        }

        function closeGiftModal() {
            document.getElementById("giftModal").style.display = "none";
        }

        function sendGift(gift) {
            closeGiftModal();
            document.getElementById("gameMessage").innerText = `✨ Siz stoldagilarga ${gift} sovg'a yubordingiz!`;
        }
    </script>
</body>
</html>
