<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Целуй и знакомься - Shaxsiy Rejim</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
            font-size: 13px;
            z-index: 20;
        }
        .balance-box {
            background: #2c2c2c;
            padding: 4px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ff4081;
            font-weight: bold;
            border: 1px solid #ff4081;
        }
        .table-info-badge {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
            border: 1px solid #ff9800;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .top-icons { display: flex; gap: 8px; }
        .icon-btn {
            background: #2c2c2c;
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        /* Game Arena */
        .game-arena {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #3d2212 0%, #1a0f08 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bottle {
            width: 30px;
            height: 110px;
            background: linear-gradient(to right, #d32f2f, #f44336, #b71c1c);
            border-radius: 15px 15px 6px 6px;
            position: absolute;
            transform-origin: center center;
            transition: transform 3.5s cubic-bezier(0.15, 0.9, 0.2, 1);
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        .bottle::after {
            content: '';
            position: absolute;
            top: 5px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 25px; background: rgba(255,255,255,0.4);
            border-radius: 4px;
        }

        /* Seats (12 o'rin) */
        .seat {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 55px;
            cursor: pointer;
            text-align: center;
        }
        .avatar-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #ff9800;
            overflow: hidden;
            background: #444;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .player-name {
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            padding: 1px 4px;
            border-radius: 6px;
            margin-top: 2px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Flying Gift Animation */
        .flying-gift {
            position: absolute;
            font-size: 32px;
            z-index: 150;
            animation: flyToTarget 1.2s ease-in-out forwards;
            pointer-events: none;
        }
        @keyframes flyToTarget {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(1) translateY(-40px); opacity: 0; }
        }

        /* Kiss Popup */
        .kiss-popup {
            display: none;
            position: absolute;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #ff4081;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            width: 240px;
        }
        .kiss-popup h4 { font-size: 13px; margin-bottom: 10px; color: #ff80ab; }
        .popup-btns { display: flex; gap: 10px; justify-content: center; }
        .p-btn { padding: 6px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-yes { background: #e91e63; color: white; }
        .btn-no { background: #616161; color: white; }

        /* Bottom Controls */
        .bottom-container {
            background: #181818;
            border-top: 1px solid #333;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .target-indicator { font-size: 10px; color: #aaa; }
        .target-indicator span { color: #ff4081; font-weight: bold; }

        .gifts-strip {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        .gift-btn {
            background: #252525;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            cursor: pointer;
            color: #ddd;
        }
        .gift-btn span:first-child { font-size: 15px; }
        .gift-btn:hover { background: #333; border-color: #ff4081; }

        .chat-area {
            height: 50px;
            background: #111;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            padding: 5px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.4;
        }
        .chat-input-row { display: flex; gap: 5px; }
        .chat-input {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 5px 8px;
            color: white;
            font-size: 11px;
        }
        .send-msg-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e1e;
            border: 1px solid #444;
            width: 88%;
            max-width: 320px;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 10px; font-size: 15px; color: #ff9800; }
        .close-modal {
            margin-top: 12px;
            background: #444;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .table-list { max-height: 140px; overflow-y: auto; margin-bottom: 10px; text-align: left; }
        .table-row {
            display: flex;
            justify-content: space-between;
            background: #2c2c2c;
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .table-row:hover { background: #3a3a3a; }

        .tabs { display: flex; justify-content: space-around; border-bottom: 1px solid #444; margin-bottom: 8px; font-size: 12px; }
        .tab { background: none; border: none; color: #aaa; padding: 4px; cursor: pointer; font-weight: bold; }
        .tab.active { color: #ff9800; border-bottom: 2px solid #ff9800; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="balance-box">
            ❤️ <span id="myHearts">∞ Cheksiz</span>
        </div>
        <div class="table-info-badge" onclick="openModal('tablesModal')">
            Stol #<span id="currentTableNum">1</span> (12 max) 🪑
        </div>
        <div class="top-icons">
            <button class="icon-btn" onclick="openModal('ratingModal')">🏆</button>
            <button class="icon-btn" onclick="openModal('tablesModal')">🪑</button>
        </div>
    </div>

    <div class="game-arena" id="gameArena">
        <div class="bottle" id="bottle" onclick="spinBottle()"></div>

        <div class="kiss-popup" id="kissPopup">
            <h4 id="kissPopupText">Juftlik chiqdi! O'pishasizmi?</h4>
            <div class="popup-btns">
                <button class="p-btn btn-yes" onclick="answerKiss(true)">💋 Ha</button>
                <button class="p-btn btn-no" onclick="answerKiss(false)">❌ Yo'q</button>
            </div>
        </div>
    </div>

    <div class="bottom-container">
        <div class="target-indicator">
            🎁 Tanlangan o'yinchi: <span id="selectedTargetName">Barchaga</span>
        </div>
        <div class="gifts-strip">
            <div class="gift-btn" onclick="sendGift('💋', 1)"><span>💋</span><span>1 ❤️</span></div>
            <div class="gift-btn" onclick="sendGift('🌹', 2)"><span>🌹</span><span>2 ❤️</span></div>
            <div class="gift-btn" onclick="sendGift('🍫', 3)"><span>🍫</span><span>3 ❤️</span></div>
            <div class="gift-btn" onclick="sendGift('⭐', 5)"><span>⭐</span><span>5 ❤️</span></div>
            <div class="gift-btn" onclick="sendGift('🧸', 8)"><span>🧸</span><span>8 ❤️</span></div>
            <div class="gift-btn" onclick="sendGift('👑', 10)"><span>👑</span><span>10 ❤️</span></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div><b>Tizim:</b> Sovg'a animatsiyalari faollashtirildi!</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" class="chat-input" placeholder="Xabar yozish...">
            <button class="send-msg-btn" onclick="sendChatMessage()">Yuborish</button>
        </div>
    </div>

    <div class="modal" id="tablesModal">
        <div class="modal-content">
            <h3>🪑 Stollar (Maksimal 12 kishi)</h3>
            <div class="table-list" id="tableListContainer"></div>
            <button class="send-msg-btn" style="width:100%; padding:6px; margin-bottom:6px;" onclick="createNewTable()">➕ Yangi stol ochish</button>
            <button class="close-modal" onclick="closeModal('tablesModal')">Yopish</button>
        </div>
    </div>

    <div class="modal" id="ratingModal">
        <div class="modal-content">
            <h3>🏆 O'yin Reytingi</h3>
            <div style="font-size: 11px; background: rgba(255,152,0,0.15); padding: 4px; border-radius: 6px; margin-bottom: 6px;">
                Sizning o'rningiz: 1-o'rin 👑 (Cheksiz)
            </div>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('kiss')">O'pishish</button>
                <button class="tab" onclick="switchTab('rich')">Boylar</button>
            </div>
            <div id="rankListContent" style="font-size: 11px; text-align: left; max-height: 120px; overflow-y: auto;"></div>
            <button class="close-modal" onclick="closeModal('ratingModal')">Yopish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const myUserId = user ? user.id : 12345;
        const myName = user ? (user.first_name + (user.last_name ? ' ' + user.last_name : '')) : "Siz";
        const myPhoto = user?.photo_url || "https://cdn-icons-png.flaticon.com/512/847/847969.png";

        document.getElementById('myHearts').innerText = "∞ Cheksiz";

        let currentTable = 1;
        let tablesData = {
            1: [
                { id: myUserId, name: myName, photo: myPhoto, gender: 'male' },
                { id: 101, name: "Madina", photo: "https://cdn-icons-png.flaticon.com/512/145/145867.png", gender: 'female' },
                { id: 102, name: "Jasur", photo: "https://cdn-icons-png.flaticon.com/512/147/147144.png", gender: 'male' },
                { id: 103, name: "Zaynab", photo: "https://cdn-icons-png.flaticon.com/512/2922/2922510.png", gender: 'female' },
                { id: 104, name: "Sardor", photo: "https://cdn-icons-png.flaticon.com/512/147/147142.png", gender: 'male' }
            ]
        };

        function renderSeats() {
            const arena = document.getElementById('gameArena');
            document.querySelectorAll('.seat').forEach(el => el.remove());

            const players = tablesData[currentTable] || [];
            const radius = 115;
            const centerX = arena.clientWidth / 2;
            const centerY = arena.clientHeight / 2;

            players.forEach((p, idx) => {
                const angle = (idx / Math.max(players.length, 1)) * 2 * Math.PI;
                const x = centerX + radius * Math.cos(angle) - 27;
                const y = centerY + radius * Math.sin(angle) - 27;

                const seatDiv = document.createElement('div');
                seatDiv.className = 'seat';
                seatDiv.style.left = `${x}px`;
                seatDiv.style.top = `${y}px`;
                seatDiv.onclick = () => selectTargetPlayer(p.name);

                seatDiv.innerHTML = `
                    <div class="avatar-wrap"><img src="${p.photo}" alt="avatar"></div>
                    <div class="player-name">${p.name}</div>
                `;
                arena.appendChild(seatDiv);
            });
            document.getElementById('currentTableNum').innerText = currentTable;
        }

        function switchTable(tId) {
            if (!tablesData[tId]) {
                tablesData[tId] = [{ id: myUserId, name: myName, photo: myPhoto, gender: 'male' }];
            } else if (tablesData[tId].length >= 12) {
                alert("Bu stol to'lgan! Maksimal 12 ta o'yinchi sig'adi.");
                return;
            }
            currentTable = tId;
            closeModal('tablesModal');
            renderSeats();
            addChatMsg("Tizim", `Stol #${tId} ga o'tdingiz.`);
        }

        function createNewTable() {
            const newId = Object.keys(tablesData).length + 1;
            tablesData[newId] = [{ id: myUserId, name: myName, photo: myPhoto, gender: 'male' }];
            currentTable = newId;
            closeModal('tablesModal');
            renderSeats();
            updateTablesModal();
            addChatMsg("Tizim", `Yangi Stol #${newId} ochildi!`);
        }

        function updateTablesModal() {
            const container = document.getElementById('tableListContainer');
            container.innerHTML = '';
            for (let id in tablesData) {
                container.innerHTML += `
                    <div class="table-row" onclick="switchTable(${id})">
                        <span>Stol #${id}</span>
                        <span>👤 ${tablesData[id].length}/12</span>
                    </div>
                `;
            }
        }

        function spinBottle() {
            const randomDeg = Math.floor(Math.random() * 360) + 1800;
            const bottle = document.getElementById('bottle');
            bottle.style.transform = `rotate(${randomDeg}deg)`;

            setTimeout(() => {
                const players = tablesData[currentTable] || [];
                const boys = players.filter(p => p.gender === 'male' || p.gender !== 'female');
                const girls = players.filter(p => p.gender === 'female');

                if (boys.length > 0 && girls.length > 0) {
                    const chosenBoy = boys[Math.floor(Math.random() * boys.length)].name;
                    const chosenGirl = girls[Math.floor(Math.random() * girls.length)].name;

                    document.getElementById('kissPopupText').innerText = `Juftlik: ${chosenBoy} ❤️ ${chosenGirl}\nO'pishasizmi?`;
                    const popup = document.getElementById('kissPopup');
                    popup.style.display = 'block';
                    popup.style.top = '38%';
                    popup.style.left = '50%';
                    popup.style.transform = 'translate(-50%, -50%)';
                } else {
                    addChatMsg("Tizim", "O'pishish uchun stolda ishtirokchilar yetarli!");
                }
            }, 3500);
        }

        function answerKiss(isYes) {
            document.getElementById('kissPopup').style.display = 'none';
            if (isYes) {
                addChatMsg("Tizim", `💋 Ajoyib! Muvaffaqiyatli amalga oshdi!`);
            } else {
                addChatMsg("Tizim", `❌ Rad etildi.`);
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (input.value.trim() !== "") {
                addChatMsg(myName, input.value);
                input.value = "";
            }
        }

        function addChatMsg(sender, text) {
            const area = document.getElementById('chatArea');
            area.innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
            area.scrollTop = area.scrollHeight;
        }

        let selectedTarget = "Barchaga";
        function selectTargetPlayer(name) {
            selectedTarget = name;
            document.getElementById('selectedTargetName').innerText = name;
        }

        function sendGift(icon, cost) {
            // Ekran o'rtasida sovg'a uchish animatsiyasi
            const arena = document.getElementById('gameArena');
            const giftEl = document.createElement('div');
            giftEl.className = 'flying-gift';
            giftEl.innerText = icon;
            giftEl.style.left = '50%';
            giftEl.style.top = '50%';
            arena.appendChild(giftEl);

            setTimeout(() => {
                giftEl.remove();
            }, 1200);

            // Chatga yozish
            addChatMsg("Sovg'a", `🎁 ${myName} ➔ ${selectedTarget}ga ${icon} yubordi! (Cheksiz)`);
        }

        const rankings = {
            kiss: [
                { name: myName, score: "∞ 💋" },
                { name: "Rustam", score: "45,120 💋" },
                { name: "Madina", score: "39,400 💋" }
            ],
            rich: [
                { name: myName, score: "∞ ❤️" },
                { name: "Alisher", score: "520,000 ❤️" },
                { name: "Zaynab", score: "95,400 ❤️" }
            ]
        };

        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const list = rankings[type] || [];
            document.getElementById('rankListContent').innerHTML = list.map((item, idx) => `
                <div style="padding: 4px 0; border-bottom: 1px solid #333;">${idx + 1}. <b>${item.name}</b> — ${item.score}</div>
            `).join('');
        }

        function openModal(id) {
            if (id === 'tablesModal') updateTablesModal();
            if (id === 'ratingModal') switchTab('kiss');
            document.getElementById(id).style.display = 'flex';
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        window.onload = () => {
            renderSeats();
        };
    </script>
</body>
</html>
