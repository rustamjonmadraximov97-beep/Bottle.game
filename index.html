<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spin the Bottle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="game-container">
        <!-- Yuqori panel: Balans va Sozlamalar -->
        <header class="game-header">
            <div class="user-info">
                <span id="username">O'yinchi</span>
            </div>
            <div class="balances">
                <div class="balance-item"><i class="fa-solid fa-coins gold"></i> <span id="gold-count">100</span></div>
                <div class="balance-item"><i class="fa-solid fa-heart ruby"></i> <span id="ruby-count">10</span></div>
            </div>
        </header>

        <!-- Asosiy Stol va Butilka -->
        <main class="table-area">
            <div class="bottle-table">
                <!-- O'rindiqlar (12 ta o'yinchi uchun) -->
                <div class="seat seat-1" data-id="1"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-2" data-id="2"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-3" data-id="3"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-4" data-id="4"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-5" data-id="5"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-6" data-id="6"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-7" data-id="7"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-8" data-id="8"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-9" data-id="9"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-10" data-id="10"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-11" data-id="11"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>
                <div class="seat seat-12" data-id="12"><div class="avatar"><i class="fa-solid fa-user"></i></div></div>

                <!-- Markaziy Butilka -->
                <div class="bottle-wrapper" id="spin-btn">
                    <img src="https://cdn-icons-png.flaticon.com/512/861/861060.png" alt="Bottle" id="bottle">
                </div>
            </div>
        </main>

        <!-- Pastki menyu va Harakatlar -->
        <footer class="game-footer">
            <button class="menu-btn" id="gift-modal-open"><i class="fa-solid fa-gift"></i> Sovg'alar</button>
            <button class="spin-action-btn" id="main-spin">Aylantirish</button>
            <button class="menu-btn" id="chat-modal-open"><i class="fa-solid fa-comments"></i> Chat</button>
        </footer>
    </div>

    <!-- Sovg'alar Modali -->
    <div class="modal" id="gift-modal">
        <div class="modal-content">
            <span class="close-btn" id="gift-close">&times;</span>
            <h3>Sovg'a Tanlang</h3>
            <div class="gifts-grid">
                <div class="gift-card" data-price="1"><img src="https://cdn-icons-png.flaticon.com/512/2965/2965567.png"><span class="price">1 🪙</span></div>
                <div class="gift-card" data-price="3"><img src="https://cdn-icons-png.flaticon.com/512/4290/4290854.png"><span class="price">3 🪙</span></div>
                <div class="gift-card" data-price="5"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png"><span class="price">5 🪙</span></div>
                <div class="gift-card" data-price="10"><img src="https://cdn-icons-png.flaticon.com/512/942/942748.png"><span class="price">10 🪙</span></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
