<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Bottle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #2b1d0c;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .table {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, #5c3a21 60%, #3a2213 100%);
            border: 8px solid #8b5a2b;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .bottle {
            width: 40px;
            height: 140px;
            background: linear-gradient(to right, #2e7d32, #4caf50, #1b5e20);
            border-radius: 10px 10px 5px 5px;
            position: relative;
            transform-origin: center center;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: pointer;
        }
        .bottle::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 12px;
            width: 16px;
            height: 20px;
            background: #1b5e20;
            border-radius: 3px 3px 0 0;
        }
        .spin-btn {
            margin-top: 30px;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .spin-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h2>Aylana Shisha 🍾</h2>

    <div class="table">
        <div class="bottle" id="bottle"></div>
    </div>

    <button class="spin-btn" onclick="spinBottle()">Aylantirish!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentRotation = 0;
        const bottle = document.getElementById('bottle');

        function spinBottle() {
            const extraDegrees = Math.floor(Math.random() * 360) + 1440; // Kamida 4 marta to'liq aylanadi
            currentRotation += extraDegrees;
            bottle.style.transform = `rotate(${currentRotation}deg)`;
        }
    </script>
</body>
</html>
