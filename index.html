<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spin the Bottle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1e110a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Yuqori Panel */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            font-size: 14px;
        }
        .stat-item { display: flex; align-items: center; gap: 5px; }

        /* O'yin Maydoni (Yog'och Stol) */
        .game-field {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #8b5a2b 0%, #4a2c11 70%, #2b1708 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #5c3a21;
        }

        /* Shisha */
        .bottle {
            width: 45px;
            height: 150px;
            background: linear-gradient(to right, #2e7d32, #4caf50, #1b5e20);
            border-radius: 12px 12px 6px 6px;
            position: absolute;
            transform-origin: center center;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .bottle::before {
            content: ''; position: absolute; top: -22px; left: 14px;
            width: 17px; height: 22px; background: #1b5e20; border-radius: 4px 4px 0 0;
        }

        /* O'yinchilar Slotlari (Doira bo'ylab) */
        .player-slot {
            position: absolute;
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            text-align: center;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            border: 2px solid #ffb74d;
            background: #3a2213;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }
        .player-name {
            margin-top: 4px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
            max-width: 75px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Slotlarning Stol Atrofidagi O'rni */
        .slot-top { top: 15px; }
        .slot-bottom-left { bottom: 20px; left: 20px; }
        .slot-bottom-right { bottom: 20px; right: 20px; }
        .slot-top-left { top: 70px; left: 15px; }
        .slot-top-right { top: 70px; right: 15px; }

        /* Pastki Chat Panel */
        .chat-container {
            height: 180px;
            background: #150b06;
            display: flex;
            flex-direction: column;
            padding: 8px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 6px;
        }
        .msg { background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 6px; }
        .msg-user { color: #ffb74d; font-weight: bold; }
        
        .chat-input-box { display: flex; gap: 5px; }
        .chat-input-box input {
            flex: 1; background: #2b1708; border: 1px solid #5c3a21;
            color: white; padding: 8px; border-radius: 15px; outline: none;
        }
        .send-btn {
            background: #ff9800; border: none; color: white;
            padding: 0 15px; border-radius: 15px; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Yuqori panel -->
    <div class="top-bar">
        <div class="stat-item">❤️ <span>0</span></div>
        <div class="stat-item">🏆 <span>Stol #3003</span></div>
        <div class="stat-item">👥 <span>1/6</span></div>
    </div>

    <!-- O'yin Maydoni -->
    <div class="game-field">
        <!-- O'yinchilar -->
        <div class="player-slot slot-top" id="slot-1">
            <img src="https://via.placeholder.com/55?text=Bo'sh" class="avatar" id="p1-avatar">
            <span class="player-name" id="p1-name">Kutilmoqda...</span>
        </div>
        
        <div class="player-slot slot-bottom-left" id="my-slot">
            <img src="https://via.placeholder.com/55?text=Siz" class="avatar" id="my-avatar">
            <span class="player-name" id="my-name">Siz</span>
        </div>

        <div class="player-slot slot-bottom-right">
            <img src="https://via.placeholder.com/55?text=Bo'sh" class="avatar">
            <span class="player-name">Joy bo'sh</span>
        </div>

        <!-- Shisha -->
        <div class="bottle" id="bottle" onclick="spinBottle()"></div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-container">
        <div class="chat-messages" id="chat-box">
            <div class="msg"><span class="msg-user">Tizim:</span> Xush kelibsiz! Shishani bosing.</div>
        </div>
        <div class="chat-input-box">
            <input type="text" id="chat-input" placeholder="Xabar yozing...">
            <button class="send-btn" onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Telegram foydalanuvchisini aniqlash
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('my-name').innerText = user.first_name;
            if (user.photo_url) {
                document.getElementById('my-avatar').src = user.photo_url;
            }
        }

        // Shishani aylantirish
        let currentRotation = 0;
        function spinBottle() {
            const extraDegrees = Math.floor(Math.random() * 360) + 1440;
            currentRotation += extraDegrees;
            document.getElementById('bottle').style.transform = `rotate(${currentRotation}deg)`;
        }

        // Chatga xabar yuborish
        function sendMsg() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            
            const myName = document.getElementById('my-name').innerText;
            msgDiv.innerHTML = `<span class="msg-user">${myName}:</span> ${input.value}`;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            input.value = '';
        }
    </script>
</body>
</html>
