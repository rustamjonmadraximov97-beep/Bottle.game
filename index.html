<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spin the Bottle Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1e110a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: rgba(0, 0, 0, 0.5);
            font-size: 13px; font-weight: bold; z-index: 20;
        }
        .top-icons { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.15); border: none; color: white;
            padding: 6px; border-radius: 50%; cursor: pointer;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
        }

        /* Game Field */
        .game-field {
            flex: 1; position: relative;
            background: radial-gradient(circle, #8b5a2b 0%, #4a2c11 70%, #2b1708 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .bottle {
            width: 35px; height: 120px;
            background: linear-gradient(to right, #2e7d32, #4caf50, #1b5e20);
            border-radius: 10px 10px 5px 5px; position: absolute;
            transform-origin: center center; transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 10; cursor: pointer;
        }

        /* Players on Table */
        .player-card {
            position: absolute; display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer;
        }
        .avatar {
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ffb74d; object-fit: cover;
        }

        /* Gift & Chat Panel */
        .bottom-panel {
            background: #ffffff; color: #333; border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-height: 250px;
        }
        .gift-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 120px; overflow-y: auto;
        }
        .gift-item {
            background: #f5f5f5; border-radius: 10px; padding: 6px 2px;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid #e0e0e0;
        }

        /* Chat Area */
        .chat-box {
            height: 70px; background: #f0f0f0; border-radius: 10px; padding: 6px; overflow-y: auto; font-size: 11px;
        }
        .chat-input-group { display: flex; gap: 4px; }
        .chat-input { flex: 1; padding: 6px; border-radius: 8px; border: 1px solid #ccc; font-size: 11px; }
        .send-btn { background: #2e7d32; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; }

        /* Modals */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; color: #333; padding: 15px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center;
        }
        .tab-group { display: flex; justify-content: space-around; margin-bottom: 10px; border-bottom: 1px solid #ccc; }
        .tab-btn { background: none; border: none; font-weight: bold; padding: 5px; cursor: pointer; color: #666; }
        .tab-btn.active { color: #2e7d32; border-bottom: 2px solid #2e7d32; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; }
        .buy-btn { background: #ff9800; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Audio Effects -->
    <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- Top Bar -->
    <div class="top-bar">
        <div onclick="openModal('shopModal')" style="cursor: pointer;">❤️ <span id="my-hearts">0</span> ➕</div>
        <div class="top-icons">
            <button class="icon-btn" onclick="toggleMusic()">🎵</button>
            <button class="icon-btn" onclick="openModal('leaderboardModal')">🏆</button>
            <button class="icon-btn" onclick="openModal('shopModal')">🛒</button>
        </div>
    </div>

    <!-- Game Field -->
    <div class="game-field">
        <div class="player-card" style="top: 10px;" onclick="setTargetPlayer('O‘yinchi 1')">
            <img class="avatar" id="mainAvatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Avatar">
            <span id="targetName" style="background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 8px;">O‘yinchi</span>
        </div>
        <div class="bottle" id="bottle" onclick="spinBottle()"></div>
    </div>

    <!-- Bottom Panel: Gifts & Chat -->
    <div class="bottom-panel">
        <div style="font-size: 11px; font-weight: bold;">
            🎁 Sovg‘a oluvchi: <span id="displayTargetName" style="color: #2e7d32;">Barchaga</span>
        </div>
        <div class="gift-grid">
            <div class="gift-item" onclick="sendGift('💋', 100)"><span style="font-size: 16px;">💋</span><span>100 ❤️</span></div>
            <div class="gift-item" onclick="sendGift('🌹', 500)"><span style="font-size: 16px;">🌹</span><span>500 ❤️</span></div>
            <div class="gift-item" onclick="sendGift('👑', 2000)"><span style="font-size: 16px;">👑</span><span>2,000 ❤️</span></div>
            <div class="gift-item" onclick="sendGift('💎', 5000)"><span style="font-size: 16px;">💎</span><span>5,000 ❤️</span></div>
            <div class="gift-item" onclick="sendGift('🏎️', 10000)"><span style="font-size: 16px;">🏎️</span><span>10,000 ❤️</span></div>
        </div>

        <!-- Chat Section -->
        <div class="chat-box" id="chatBox">
            <div><b>Tizim:</b> O‘yinga xush kelibsiz!</div>
        </div>
        <div class="chat-input-group">
            <input type="text" id="chatInput" class="chat-input" placeholder="Xabar yozing...">
            <button class="send-btn" onclick="sendMessage()">Yuborish</button>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <h3>🏆 Reyting</h3>
            <div class="tab-group">
                <button class="tab-btn active" onclick="switchTab('daily')">Kunlik</button>
                <button class="tab-btn" onclick="switchTab('weekly')">Haftalik</button>
                <button class="tab-btn" onclick="switchTab('monthly')">Oylik</button>
                <button class="tab-btn" onclick="switchTab('all')">Doimiy</button>
            </div>
            <div id="rankList" style="font-size: 12px; text-align: left; max-height: 150px; overflow-y: auto;">
                <!-- Dinamik profillar chiqadi -->
            </div>
            <button onclick="closeModal('leaderboardModal')" style="margin-top: 10px; padding: 4px 12px; cursor: pointer;">Yopish</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <h3>🛒 Yurakchalar Do'koni</h3>
            <p style="font-size: 11px; color: #666; margin-bottom: 8px;">Bonus sotib olish uchun adminga yozing:</p>
            <div class="shop-item">
                <span>❤️ 50,000 bonus</span>
                <button class="buy-btn" onclick="buyViaAdmin(50000, '50,000')">Sotib olish</button>
            </div>
            <div class="shop-item">
                <span>❤️ 200,000 bonus</span>
                <button class="buy-btn" onclick="buyViaAdmin(200000, '200,000')">Sotib olish</button>
            </div>
            <div class="shop-item">
                <span>❤️ 500,000 bonus</span>
                <button class="buy-btn" onclick="buyViaAdmin(500000, '500,000')">Sotib olish</button>
            </div>
            <button onclick="closeModal('shopModal')" style="margin-top: 10px; padding: 4px 12px; cursor: pointer;">Yopish</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const username = user ? user.first_name : "Mehmon";

        if (user && user.photo_url) {
            document.getElementById('mainAvatar').src = user.photo_url;
            document.getElementById('targetName').innerText = username;
        }

        // Bonus Tizimi (Siz uchun kunlik 50k, yangilarga 10k)
        let hearts = parseInt(localStorage.getItem('user_hearts'));
        const today = new Date().toDateString();
        const lastBonusDate = localStorage.getItem('last_bonus_date');

        if (isNaN(hearts)) {
            hearts = 10000; // Yangi odamga 10,000
        }

        if (lastBonusDate !== today) {
            hearts += 50000; // Kunlik 50,000 bonus
            localStorage.setItem('user_hearts', hearts);
            localStorage.setItem('last_bonus_date', today);
            alert("🎁 Kunlik bonus! Sizga 50,000 yurak berildi!");
        }
        document.getElementById('my-hearts').innerText = hearts;

        // Music Control
        let isMusicPlaying = false;
        function toggleMusic() {
            const audio = document.getElementById('bgMusic');
            if (isMusicPlaying) { audio.pause(); } else { audio.play(); }
            isMusicPlaying = !isMusicPlaying;
        }

        // Chat Tizimi
        function sendMessage() {
            const input = document.getElementById('chatInput');
            if (input.value.trim() !== "") {
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML += `<div><b>${username}:</b> ${input.value}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                socket.emit('chatMessage', { user: username, text: input.value });
                input.value = "";
            }
        }

        // Sovg'a yuborish
        let activeTarget = "Barchaga";
        function setTargetPlayer(name) {
            activeTarget = name;
            document.getElementById('displayTargetName').innerText = name;
        }

        function sendGift(icon, cost) {
            if (hearts >= cost) {
                hearts -= cost;
                localStorage.setItem('user_hearts', hearts);
                document.getElementById('my-hearts').innerText = hearts;
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML += `<div>🎁 <b>${username}</b> -> <b>${activeTarget}</b> ga ${icon} sovg'a qildi!</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                alert("Yurakchalar yetarli emas! Do'kondan xarid qiling.");
            }
        }

        // Admin orqali sotib olish (Sizning Telegram profilingizga o'tadi)
        function buyViaAdmin(amount, title) {
            const adminUsername = "rustamjonmadraximov97-beep"; // O'z Telegram username'ingizni shu yerga yozing
            const text = encodeURIComponent(`Salom! Men ${title} yurak bonusini sotib olmoqchiman.`);
            window.open(`https://t.me/${adminUsername}?text=${text}`, '_blank');
        }

        // Reyting Profillari
        const rankings = {
            daily: [`1. ${username} — ${hearts} ❤️`, `2. Alisher — 45,000 ❤️`, `3. Madina — 20,000 ❤️`],
            weekly: [`1. Alisher — 250,000 ❤️`, `2. ${username} — ${hearts} ❤️`, `3. Jasur — 110,000 ❤️`],
            monthly: [`1. Bekzod — 900,000 ❤️`, `2. Madina — 750,000 ❤️`, `3. ${username} — ${hearts} ❤️`],
            all: [`1. ${username} — ${hearts} ❤️`, `2. Bekzod — 1,500,000 ❤️`, `3. Alisher — 1,200,000 ❤️`]
        };

        function switchTab(period) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const listContainer = document.getElementById('rankList');
            listContainer.innerHTML = rankings[period].join('<br>');
        }

        // Dastlabki reytingni yuklash
        document.getElementById('rankList').innerHTML = rankings.daily.join('<br>');

        // Modallar
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Socket.IO Multiplayer
        const socket = io('https://bottle-game-oq5s.onrender.com');

        socket.on('connect', () => {
            socket.emit('joinTable', { tableId: 'table_1' });
        });

        function spinBottle() {
            const randomAngle = Math.floor(Math.random() * 360) + 1440;
            socket.emit('spinBottle', { tableId: 'table_1', angle: randomAngle });
        }

        socket.on('bottleSpun', (data) => {
            const bottle = document.getElementById('bottle');
            if (bottle) {
                bottle.style.transition = 'transform 4s cubic-bezier(0.15, 0.45, 0.15, 1)';
                bottle.style.transform = `rotate(${data.angle}deg)`;
            }
        });
    </script>
</body>
</html>
